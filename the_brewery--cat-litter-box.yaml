    type: sleep_sun
    name: "Sunday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_sun
    name: "Sunday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_mon
    name: "Monday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_mon
    name: "Monday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_tue
    name: "Tuesday Sleep Time"
    disabled_by_default: true
