packages:
  global: !include packages/global.yaml
  wifi: !include packages/brewery-coast-wifi.yaml
  lr4_base: !include packages/litter-robot-4/base.yaml
  lr4_sleep_schedule: !include packages/litter-robot-4/sleep-schedule.yaml
  lr4_wifi: !include packages/litter-robot-4/wifi.yaml
  lr4_hopper: !include packages/litter-robot-4/hopper.yaml
  lr4_smart_detection: !include packages/litter-robot-4/smart-detection.yaml
  lr4_cat_tracking: !include
    file: packages/litter-robot-4/cat-tracking.yaml
    vars:
      weight_sensor_id: last_cat_weight
  # Last: custom-status !extends entities the packages above define.
  lr4_custom_status: !include packages/litter-robot-4/custom-status.yaml

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"

substitutions:
  slug: cat-litter-box
  name: Cat Litter Box

external_components:
  source:
    type: git
    url: https://codeberg.org/Joseph-DiGiovanni/esphome-litter-robot.git
    ref: LR4/2026.9.2

logger:
  level: debug
