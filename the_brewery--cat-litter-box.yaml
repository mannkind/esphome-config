    type: wake_tue
    name: "Tuesday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_wed
    name: "Wednesday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_wed
    name: "Wednesday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_thu
    name: "Thursday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_thu
    name: "Thursday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_fri
    name: "Friday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_fri
    name: "Friday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_sat
    name: "Saturday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_sat
    name: "Saturday Wake Time"
    disabled_by_default: true

binary_sensor:
  - platform: litter_robot4
    type: waste_drawer_full
    name: "Waste Drawer Full"
  - platform: litter_robot4
    type: bonnet_removed
    name: "Bonnet Removed"
    disabled_by_default: true
  - platform: litter_robot4
    type: night_light
    name: "Night Light"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_status
    name: "Sleep Status"
    disabled_by_default: true
  - platform: litter_robot4
    type: fault_status
    name: "Fault Status"
  - platform: litter_robot4
    type: laser_detect
