# Vendored from esphome-litter-robot LR4/2026.10.0
#   packages/litter-robot4/default.yaml
#
# Local changes from upstream:
#   - Kept only the UART, component, and entity definitions. The device file
#     owns the project wrapper, external component source, and ESP32 settings
#     because this board needs sram1_as_iram and a minimum_chip_revision.
#   - Kept time wiring here instead of sleep-schedule.yaml. It uses
#     homeassistant_time from packages/global.yaml, syncs every 24 hours, and
#     also syncs on boot once Home Assistant time is valid.
#   - Renamed "Sleeping" to "Sleep Status" and left it disabled by default, to
#     preserve the entity this device already exposes in Home Assistant.

uart:
  - id: uart_bus
    tx_pin: GPIO19
    rx_pin:
      number: GPIO5
      ignore_strapping_warning: true
    baud_rate: 256000
    rx_buffer_size: 2048

litter_robot4:
  id: my_litter_robot4

esphome:
  on_boot:
    - priority: -100
      then:
        - wait_until:
            lambda: "return id(homeassistant_time).now().is_valid();"
        - litter_robot4.sync_time:
            time_id: homeassistant_time

interval:
  - interval: 24h
    then:
      - litter_robot4.sync_time:
          time_id: homeassistant_time

text_sensor:
