# Vendored from esphome-litter-robot LR4/2026.9.1
#   packages/litter-robot4/base.yaml
#
# Local changes from upstream:
#   - Dropped upstream's `esp32:` block. The device file sets its own, because
#     this board needs sram1_as_iram and a minimum_chip_revision.
#   - Kept the time wiring here rather than where 2026.9.1 moved it
#     (sleep-schedule.yaml): `time_id` points at homeassistant_time from
#     packages/global.yaml, and the 24h sync interval lives here. The clock is
#     not a sleep-schedule concern and base is always included.
#   - Added an on_boot time sync. Upstream only syncs on a 24h interval, which
#     leaves the robot's clock uncorrected for a day after a fresh flash.
#   - Renamed "Sleeping" to "Sleep Status", to match the entity this device
#     already exposes in Home Assistant.
#
# Upstream changes in 2026.9.1 that move entities, worth knowing before you go
# looking for them:
#   - The "Status" template sensor and its update_status script moved to
#     custom-status.yaml; the hopper switch moved to hopper.yaml.
#   - laser_detect/weight_detect are now curtain_detected/weight_detected.
#   - bonnet_removed is now bonnet, and the component inverts it: it reads true
#     when the bonnet is ON, not removed. The HA entity flips meaning.
#   - The hopper_motor binary_sensor is gone from the component entirely; there
#     is no replacement, and hopper.yaml's "Hopper Status" covers the ground.
#   - New debug_mode switch.

uart:
  - id: uart_bus
    tx_pin: GPIO19
    rx_pin: GPIO5
    baud_rate: 256000
    rx_buffer_size: 2048

litter_robot4:
  id: my_litter_robot4
  time_id: homeassistant_time

esphome:
  on_boot:
    - priority: -100
      then:
        - wait_until:
            lambda: "return id(homeassistant_time).now().is_valid();"
        - litter_robot4.sync_time: my_litter_robot4

interval:
  - interval: 24h
    then:
      - litter_robot4.sync_time: my_litter_robot4

text_sensor:
  - platform: litter_robot4
    type: status
    id: robot_status
    name: "Robot Status"
    internal: true
  - platform: litter_robot4
    type: power_type
    id: power_type
    name: "Power Type"
  - platform: litter_robot4
    type: fault
    id: fault
    name: "Fault"

button:
  - platform: litter_robot4
    type: cycle
    id: cycle
    name: "Manual Cycle"
  - platform: litter_robot4
    type: empty
    id: empty
    name: "Empty Litter"
  - platform: litter_robot4
    type: replace_filter
    id: replace_filter
    name: "Replace Filter"
  - platform: litter_robot4
    type: factory_reset
    id: factory_reset
    name: "Factory Reset"
  - platform: litter_robot4
    type: reset
    id: reset
    name: "Reset"

sensor:
  - platform: litter_robot4
    type: waste_drawer_level
    id: waste_drawer_level
    name: "Waste Drawer Level"
  - platform: litter_robot4
    type: litter_level
    id: litter_level
    name: "Litter Level"
  - platform: litter_robot4
    type: last_cat_weight
    id: last_cat_weight
    name: "Last Cat Weight"
  - platform: litter_robot4
    type: clean_cycle_count
    id: clean_cycle_count
    name: "Clean Cycles"
  - platform: litter_robot4
    type: power_cycle_count
    id: power_cycle_count
    name: "Power Cycles"
    disabled_by_default: true
  - platform: litter_robot4
    type: empty_cycle_count
    id: empty_cycle_count
    name: "Empty Cycles"
    disabled_by_default: true
  - platform: litter_robot4
    type: filter_cycle_count
    id: filter_cycle_count
    name: "Filter Cycles"
    disabled_by_default: true

number:
  - platform: litter_robot4
    type: clean_cycle_delay
    id: clean_cycle_delay
    name: "Clean Cycle Delay"

select:
  - platform: litter_robot4
    type: night_light_mode
    id: night_light_mode
    name: "Night Light Mode"
  - platform: litter_robot4
    type: night_light_brightness
    id: night_light_brightness
    name: "Night Light Brightness"
  - platform: litter_robot4
    type: panel_brightness
    id: panel_brightness
    name: "Panel Brightness"

switch:
  - platform: litter_robot4
    type: control_panel_lockout
    id: control_panel_lockout
    name: "Control Panel Lockout"
  - platform: litter_robot4
    type: power
    id: power
    name: "Power"
  - platform: litter_robot4
    type: debug_mode
    id: debug_mode
    name: "Debug Mode"

binary_sensor:
  - platform: litter_robot4
    type: waste_drawer_full
    id: waste_drawer_full
    name: "Waste Drawer Full"
  - platform: litter_robot4
    type: bonnet
    id: bonnet
    name: "Bonnet"
    disabled_by_default: true
  - platform: litter_robot4
    type: night_light
    id: night_light
    name: "Night Light"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleeping
    id: sleeping
    name: "Sleep Status"
    disabled_by_default: true
  - platform: litter_robot4
    type: curtain_detected
    id: curtain_detected
    name: "Curtain Detected"
  - platform: litter_robot4
    type: weight_detected
    id: weight_detected
    name: "Weight Detected"
