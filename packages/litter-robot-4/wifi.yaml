# Vendored from esphome-litter-robot LR4/2026.9.1
#   packages/litter-robot4/wifi.yaml
#
# Local changes from upstream:
#   - Dropped the apply_wifi_status script and the select's on_value hook into
#     it. REG_WIFI_STATUS is polled, and the select publishes whatever the robot
#     reports, so the robot reporting "Off" would disable WiFi on the ESP and
#     leave the device unreachable until someone power-cycles it in person.
#     Upstream deferred that branch to a script in 2026.9.1; the branch itself
#     is what we don't want. The ESP -> robot panel sync below is kept.
#     custom-status.yaml !extends the same select for its update_status hook,
#     so the select needs no on_value here.

script:
  - id: set_robot_wifi_status
    then:
      - lambda: |-
          const char *target;
          if (esphome::wifi::global_wifi_component->is_disabled()) {
            target = "Off";
          } else if (esphome::wifi::global_wifi_component->is_connected()) {
            target = "Connected";
          } else if (esphome::wifi::global_wifi_component->is_ap_active()) {
            target = "Pairing";
          } else {
            target = "Connecting";
          }
          if (id(wifi_status).current_option() != target) {
            id(wifi_status).make_call().set_option(target).perform();
          }

interval:
  - interval: 30s
    then:
      - script.execute: set_robot_wifi_status

select:
  - platform: litter_robot4
    type: wifi_status
    id: wifi_status
    name: "WiFi Status"
    disabled_by_default: true

wifi:
  on_connect:
    then:
      - script.execute: set_robot_wifi_status
  on_disconnect:
    then:
      - script.execute: set_robot_wifi_status
