# Vendored from esphome-litter-robot LR4/2026.10.1
# Commit: e8b629773614b0aa99d510c41c597bc602eeafcc
#   packages/litter-robot4/smart-detection.yaml
#
# Unmodified from upstream.

globals:
  - id: cat_pending
    type: bool
    restore_value: no
    initial_value: "false"
  - id: smart_detect_ready
    type: bool
    restore_value: no
    initial_value: "false"

switch:
  - platform: template
    id: smart_cat_detection
    name: "Smart Cat Detection"
    icon: "mdi:check-underline-circle"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - script.execute: evaluate_cat_detection

text_sensor:
  - platform: litter_robot4
    id: !extend robot_status
    on_value:
      - lambda: |-
          if (x == "Ready")
            id(smart_detect_ready) = true;
      - script.execute: evaluate_cat_detection

binary_sensor:
  - platform: template
    id: cat_confirmed
    name: "Cat Confirmed"
    internal: true
  - platform: litter_robot4
    id: !extend curtain_detected
    on_state:
      - script.execute: evaluate_cat_detection
  - platform: litter_robot4
    id: !extend weight_detected
    on_state:
      - script.execute: evaluate_cat_detection
  - platform: litter_robot4
    id: !extend sleeping
    on_state:
      - lambda: |-
          // Re-arm the pending timeout once the robot wakes up.
          if (!id(sleeping).state && id(cat_pending) && id(robot_status).state != "Cat detected")
            id(cat_pending_expire)->execute();

script:
  - id: cat_reset_countdown
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            lambda: |-
              return id(smart_cat_detection).state && !id(cat_confirmed).state &&
                     !id(curtain_detected).state && !id(weight_detected).state &&
                     id(robot_status).state == "Cat detected";
          then:
            - button.press: reset

  - id: cat_pending_expire
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            lambda: "return id(cat_pending) && !id(sleeping).state;"
          then:
            - lambda: "id(cat_pending) = false;"

  - id: evaluate_cat_detection
    then:
      - lambda: |-
          if (!id(smart_cat_detection).state) {
            id(cat_confirmed).publish_state(false);
            id(cat_pending) = false;
            id(cat_reset_countdown)->stop();
            id(cat_pending_expire)->stop();
            return;
          }

          // Don't evaluate until the robot has reached Ready since boot
          if (!id(smart_detect_ready))
            return;

          const bool cat_detected = id(robot_status).state == "Cat detected";
          const bool agreed = id(curtain_detected).state && id(weight_detected).state;
          const bool neither = !id(curtain_detected).state && !id(weight_detected).state;

          if (!cat_detected) {
            id(cat_confirmed).publish_state(false);
            id(cat_reset_countdown)->stop();
            // Latch an overlap seen during sleep so the robot's delayed
            // "Cat detected" report can still confirm the visit.
            if (agreed) {
              id(cat_pending) = true;
              id(cat_pending_expire)->execute();
            }
            return;
          }

          if (agreed || id(cat_pending)) {
            id(cat_confirmed).publish_state(true);
            id(cat_pending) = false;
            id(cat_pending_expire)->stop();
            id(cat_reset_countdown)->stop();
            return;
          }

          // Robot reports a cat but neither sensor agrees: reset it after 10s,
          // unless it was already confirmed or exactly one sensor is active.
          if (neither && !id(cat_confirmed).state) {
            id(cat_reset_countdown)->execute();
          } else {
            id(cat_reset_countdown)->stop();
          }
