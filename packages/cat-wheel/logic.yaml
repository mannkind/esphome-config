time:
  - platform: sntp
    id: sntp_time
    servers:
      - 10.0.1.10
    on_time_sync:
      - logger.log:
          format: "Time synchronized: %s"
          args: ['id(sntp_time).now().strftime("%Y-%m-%d %H:%M:%S").c_str()']
          level: INFO
      - lambda: |-
          id(quiet_hours_start_time)
              ->make_call()
              .set_time(id(quiet_hours_start_hour), id(quiet_hours_start_minute), 0)
              .perform();

          id(quiet_hours_end_time)
              ->make_call()
              .set_time(id(quiet_hours_end_hour), id(quiet_hours_end_minute), 0)
              .perform();
      - script.execute: update_quiet_hours_status

interval:
  # Sample the rotation pin: credit magnets, reject parked chatter
  - interval: ${rotation_sample_interval}
    then:
      - script.execute: wheel_rotation_sample

  # Check for inactivity and reset training progress
  - interval: 15s
    then:
      - script.execute: inactivity_check

  # Check if stepper has finished dispensing
  - interval: 1s
    then:
      - script.execute: dispense_complete_check

  # Update quiet hours status
  - interval: 60s
    then:
      - script.execute: update_quiet_hours_status

script:

  - id: set_state_idle
    then:
      - lambda: |-
          auto old_state = id(system_state);
          const char* old_state_name = (old_state == 0) ? "IDLE" : "DISPENSING";

          ESP_LOGI("[STATE]", "Transition: %s -> IDLE", old_state_name);
          ESP_LOGI("[STATE]", "  Current interval: %.2f, magnets since last treat: %d",
                   id(treat_interval), id(magnet_detected_count));

          id(system_state) = 0;  // IDLE
          id(dispense_start_time) = 0;

  - id: set_state_dispensing
    then:
      - lambda: |-
          auto old_state = id(system_state);
          const char* old_state_name = (old_state == 0) ? "IDLE" : "DISPENSING";

          ESP_LOGI("[STATE]", "Transition: %s -> DISPENSING", old_state_name);
          ESP_LOGI("[STATE]", "  Stepper: rotating %d steps", id(stepper_steps_per_dispense));

          id(system_state) = 1;  // DISPENSING
          id(dispense_start_time) = millis();

          id(last_activity_time) = millis();

          // Command stepper to advance by configured steps
          auto current_pos = id(treat_stepper).current_position;
          id(treat_stepper).set_target(current_pos + id(stepper_steps_per_dispense));

  - id: wheel_rotation_sample
    then:
      - lambda: |-
          const unsigned long now = millis();

          unsigned long present_ms = id(window_present_ms);
          if (id(magnet_present_since) != 0) {
            present_ms += now - id(magnet_present_since);
            id(magnet_present_since) = now;
          }
          const unsigned long window_ms = now - id(window_start_time);
          id(window_present_ms) = 0;
          id(window_start_time) = now;

          // First window after boot has no meaningful span.
          if (id(last_pulse_total) < 0.0f || window_ms == 0) {
            const float seed = id(wheel_pulse_total).state;
            if (!std::isnan(seed)) {
              id(last_pulse_total) = seed;
            }
            return;
          }

          float duty = 100.0f * (float) present_ms / (float) window_ms;
          if (duty > 100.0f) duty = 100.0f;
          id(window_present_duty) = duty;

          const float total = id(wheel_pulse_total).state;
          if (std::isnan(total)) {
            return;
          }
          const int pulses = (int) lroundf(total - id(last_pulse_total));
          id(last_pulse_total) = total;
          if (pulses <= 0) {
            return;
          }

          const float park_duty = ${park_present_duty_percent};
          if (duty >= park_duty) {
            id(suppressed_park_count) += pulses;
            ESP_LOGI("[WHEEL]", "Ignoring %d pulse(s): magnet present %.0f%% of window "
                                "(>= %.0f%%) - parked, not rotating (suppressed: %d)",
                     pulses, duty, park_duty, id(suppressed_park_count));
            return;
          }

          if (id(last_activity_time) == 0) {
            id(session_start_time) = now;
          }

          id(magnet_detected_count) += pulses;

          id(distance_accum_frac) += pulses * id(hall_distance_cm);
          const int whole_cm = (int) id(distance_accum_frac);
          id(distance_accum_frac) -= (float) whole_cm;
          id(total_distance) += whole_cm;

          id(last_activity_time) = now;
          id(last_wheel_rotation_time) = now;

          ESP_LOGD("[WHEEL]", "Credited %d magnet(s), present duty %.0f%% (total: %d cm)",
                   pulses, duty, id(total_distance));

          id(treat_progress_check).execute();

  - id: treat_progress_check
    then:
      - lambda: |-
          // Nothing to decide while the stepper is already running.
          if (id(system_state) == 1) {
            return;
          }

          const float current_distance =
              id(magnet_detected_count) * id(hall_distance_cm);
          const float required_distance =
              id(distance_threshold) * id(treat_interval);

          ESP_LOGD("[WHEEL]", "Progress: %.0f/%.0f cm (total: %d cm)",
                   current_distance, required_distance, id(total_distance));

          if (current_distance < required_distance) {
            return;
          }

          if (id(is_quiet_hour)) {
            const int capped_count =
                (int) ceilf(required_distance / id(hall_distance_cm));
            if (id(magnet_detected_count) > capped_count) {
              id(magnet_detected_count) = capped_count;
            }
            ESP_LOGI("[QUIET]", "Treat earned but held until quiet hours end");
            ESP_LOGI("[QUIET]", "  Progress capped at %.0f/%.0f cm",
                     id(magnet_detected_count) * id(hall_distance_cm),
                     required_distance);
            return;
          }

          ESP_LOGI("[TREAT]", "Treat earned! Current interval: %.2f, distance: %.0f cm",
                   id(treat_interval), current_distance);

          // Update sensors showing "before dispense" state
          id(total_distance_sensor).update();
          id(distance_since_treat_sensor).update();
          id(seconds_since_rotation_sensor).update();

          // Reset magnet count and grow the interval
          id(magnet_detected_count) = 0;

          float new_interval = id(treat_interval) * id(treat_interval_growth_factor);
          if (new_interval > (float) id(max_treat_interval_multiplier)) {
            new_interval = (float) id(max_treat_interval_multiplier);
          }
          if (new_interval < 1.0f) {
            new_interval = 1.0f;
          }
          id(treat_interval) = new_interval;

          ESP_LOGI("[TREAT]", "Next interval: %.2f (growth factor: %.2f), required distance: %.0f cm",
                   id(treat_interval), id(treat_interval_growth_factor),
                   id(distance_threshold) * id(treat_interval));

          // Trigger stepper rotation
          id(set_state_dispensing).execute();

          // Update sensors showing "after dispense" state
          id(distance_since_treat_sensor).update();
          id(next_treat_distance_sensor).update();

  # Reset scripts
  - id: reset_training_progress
    then:
      - lambda: |-
          ESP_LOGI("[RESET]", "Manual training progress reset requested");
          ESP_LOGI("[RESET]", "Previous values - Distance: %d cm, Treats: %d",
                   id(total_distance), id(total_treats_dispensed));

          id(total_distance) = 0;
          id(distance_accum_frac) = 0.0f;
          id(total_treats_dispensed) = 0;

          id(reset_system_state).execute();

  - id: reset_system_state
    then:
      - lambda: |-
          ESP_LOGI("[RESET]", "System state reset requested");
          ESP_LOGI("[RESET]", "Previous state values - State: %d, Interval: %.2f, Magnet count: %d",
                   id(system_state), id(treat_interval), id(magnet_detected_count));

          id(treat_interval) = 1.0f;
          id(magnet_detected_count) = 0;
          id(last_activity_time) = 0;
          id(last_wheel_rotation_time) = 0;
          id(session_start_time) = 0;

          ESP_LOGI("[RESET]", "System state reset complete");
          id(set_state_idle).execute();

          // Force sensor updates to reflect reset values
          id(distance_since_treat_sensor).update();
          id(next_treat_distance_sensor).update();

  - id: inactivity_check
    then:
      - lambda: |-
          if (id(last_activity_time) == 0) {
            return;
          }

          unsigned long current_time = millis();
          if (current_time < id(last_activity_time)) {
            ESP_LOGW("[INACTIVITY]", "millis() wraparound detected, resetting activity time");
            id(last_activity_time) = current_time;
            return;
          }

          unsigned long elapsed = current_time - id(last_activity_time);
          if (elapsed <= id(inactivity_reset_time)) {
            return;
          }

          ESP_LOGI("[INACTIVITY]", "Resetting due to inactivity (elapsed: %lu ms, threshold: %lu ms)",
                   elapsed, id(inactivity_reset_time));
          ESP_LOGI("[INACTIVITY]", "  Previous: interval=%.2f, magnets=%d",
                   id(treat_interval), id(magnet_detected_count));

          id(treat_interval) = 1.0f;
          id(magnet_detected_count) = 0;
          id(last_wheel_rotation_time) = 0;
          id(last_activity_time) = 0;
          id(session_start_time) = 0;

          id(set_state_idle).execute();

  - id: update_quiet_hours_status
    then:
      - lambda: |-
          auto time = id(sntp_time).now();
          if (!time.is_valid()) {
            id(is_quiet_hour) = false;
            return;
          }

          auto current_hour = time.hour;
          auto current_minute = time.minute;
          auto current_minutes_total = current_hour * 60 + current_minute;

          auto start_hour = id(quiet_hours_start_hour);
          auto start_minute = id(quiet_hours_start_minute);
          auto start_minutes_total = start_hour * 60 + start_minute;

          auto end_hour = id(quiet_hours_end_hour);
          auto end_minute = id(quiet_hours_end_minute);
          auto end_minutes_total = end_hour * 60 + end_minute;

          auto was_quiet = id(is_quiet_hour);

          if (start_minutes_total <= end_minutes_total) {
            id(is_quiet_hour) = (current_minutes_total >= start_minutes_total && current_minutes_total <= end_minutes_total);
          } else {
            id(is_quiet_hour) = (current_minutes_total >= start_minutes_total || current_minutes_total <= end_minutes_total);
          }

          if (was_quiet == id(is_quiet_hour)) {
            return;
          }

          if (id(is_quiet_hour)) {
            ESP_LOGI("[QUIET]", "Entering quiet hours (%02d:%02d-%02d:%02d)", start_hour, start_minute, end_hour, end_minute);
            return;
          }

          ESP_LOGI("[QUIET]", "Exiting quiet hours (%02d:%02d-%02d:%02d)", start_hour, start_minute, end_hour, end_minute);
          // Release any treat that was earned and held during the window.
          id(treat_progress_check).execute();

  - id: dispense_complete_check
    then:
      - lambda: |-
          if (id(system_state) != 1) {
            return;
          }

          // Check if stepper has reached its target position
          if (id(treat_stepper).current_position != id(treat_stepper).target_position) {
            return;  // Still moving
          }

          auto elapsed = millis() - id(dispense_start_time);
          ESP_LOGI("[STEPPER]", "Dispense complete (%lu ms)", elapsed);
          id(total_treats_dispensed) += 1;
          ESP_LOGI("[TREAT]", "Total treats dispensed: %d", id(total_treats_dispensed));
          id(set_state_idle).execute();
