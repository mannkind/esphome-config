packages:
  global: !include packages/global.yaml
  ethernet: !include packages/ethernet.yaml
  esp32: !include packages/esp32-s3-devkitc.yaml
  bt-proxy: !include packages/rf-proxy.yaml

substitutions:
  slug: coast-rf-proxy
  name: Coast RF Proxy (PoE)

script:
  - id: rf_low
    mode: restart
    then:
      - remote_transmitter.transmit_raw:   # Fan Low  (100110110000001100111011 = 0x9B033B)
          code: [
            5650, -7150, 630, -370, 265, -735, 265, -735, 630, -370, 630, -370, 265, -735, 630, -370, 630,
            -370, 265, -735, 265, -735, 265, -735, 265, -735, 265, -735, 265, -735, 630, -370, 630, -370,
            265, -735, 265, -735, 630, -370, 630, -370, 630, -370, 265, -735, 630, -370, 630, -370, 265
          ]
          repeat:
            times: 6
            wait_time: 7180us
