fan:
  - platform: template
    name: "Ceiling Fan"
    id: ceiling_fan
    speed_count: 3
    on_state:
      then:
        - lambda: |-
            if (!id(ceiling_fan).state)          id(rf_stop).execute();
            else if (id(ceiling_fan).speed == 1) id(rf_low).execute();
            else if (id(ceiling_fan).speed == 2) id(rf_med).execute();
            else                                 id(rf_high).execute();

button:
  - platform: template
    name: "Fan Light"
    on_press: {then: [script.execute: rf_light]}
  - platform: template
    name: "Fan Timer 1H"
    on_press: {then: [script.execute: rf_1h]}
  - platform: template
    name: "Fan Timer 2H"
    on_press: {then: [script.execute: rf_2h]}
  - platform: template
    name: "Fan Timer 4H"
    on_press: {then: [script.execute: rf_4h]}
  - platform: template
    name: "Fan Timer 8H"
    on_press: {then: [script.execute: rf_8h]}
