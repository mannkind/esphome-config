            -370, 265, -735, 265, -735, 265, -735, 265, -735, 265, -735, 630, -370, 265, -735, 265, -735,
            265, -735, 265, -735, 630, -370, 630, -370, 630, -370, 630, -370, 265, -735, 630, -370, 265
